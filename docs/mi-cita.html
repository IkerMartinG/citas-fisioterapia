<!doctype html>
<html lang="es" data-demo="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cita · Fisio Teide</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/my-appointment.js"></script>
  <script type="module" data-demo-banner src="./js/demo/banner.js" data-where="site" data-site="./" data-panel="./admin/"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <a class="brand" href="./">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0F6E66"/><path d="M7 22l6-9 4 5 3-4 5 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Fisio Teide
      </a>
      <nav aria-label="Secciones"><a href="./#pedir-cita">Pedir cita</a></nav>
    </div>
  </header>
  <main class="narrow">
    <div class="panel card">
      <h1>Mi cita</h1>
      <p>Escribe el código que te dimos al pedir la cita y tu teléfono.</p>
      <form id="lookup" novalidate>
        <div class="field"><label for="code">Código</label><input id="code" name="code" autocomplete="off" autocapitalize="characters" maxlength="6" required></div>
        <div class="field"><label for="phone">Teléfono</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
        <button class="btn btn--primary btn--block" type="submit">Buscar cita</button>
        <p class="error" id="lookup-error" role="alert" hidden></p>
      </form>
    </div>

    <div class="panel card" id="result" hidden style="margin-top: 16px">
      <h1>Tu cita</h1>
      <dl class="details">
        <dt>Tratamiento</dt><dd id="r-service"></dd>
        <dt>Fisio</dt><dd id="r-pro"></dd>
        <dt>Día</dt><dd id="r-date"></dd>
        <dt>Hora</dt><dd id="r-time"></dd>
        <dt>Estado</dt><dd id="r-status"></dd>
      </dl>
      <button class="btn btn--danger btn--block" type="button" id="cancel" hidden>Cancelar cita</button>
      <p class="muted" id="no-cancel" hidden>Quedan menos de 12 horas: para cancelar, llámanos al 922 000 000.</p>
      <p class="error" id="cancel-error" role="alert" hidden></p>
    </div>
  </main>
</body>
</html>
