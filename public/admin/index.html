<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel · Fisio Teide</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <main class="login" id="login-view" hidden>
    <form class="panel login__card" id="login">
      <h1>Fisio Teide</h1>
      <p>Panel de la clínica</p>
      <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
      <p class="error" id="login-error" role="alert" hidden></p>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="abar">
      <span class="abar__brand">Fisio Teide</span>
      <nav class="tabs" aria-label="Secciones del panel">
        <button type="button" class="tab" data-tab="agenda" aria-current="page">Agenda</button>
        <button type="button" class="tab" data-tab="patients">Pacientes</button>
      </nav>
      <div class="abar__actions">
        <button class="btn btn--primary btn--sm" type="button" id="new">Nueva cita</button>
        <button class="link-btn" type="button" id="logout">Salir</button>
      </div>
    </header>

    <!-- Agenda -->
    <section class="view" id="view-agenda">
      <div class="toolbar">
        <button class="icon-btn" type="button" id="prev" aria-label="Día anterior"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <label class="visually-hidden" for="date">Día</label>
        <input type="date" id="date">
        <button class="icon-btn" type="button" id="next" aria-label="Día siguiente"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="link-btn" type="button" id="today">Hoy</button>
        <h1 class="toolbar__title" id="day-title"></h1>
        <p class="toolbar__stats" id="day-stats"></p>
      </div>
      <div class="split">
        <div class="agenda-scroll"><div class="agenda" id="agenda"></div></div>
        <aside class="panel side" id="detail" hidden aria-live="polite"></aside>
      </div>
    </section>

    <!-- Pacientes -->
    <section class="view" id="view-patients" hidden>
      <div class="split split--patients">
        <div class="panel patients">
          <label class="field"><span class="visually-hidden">Buscar paciente</span><input type="search" id="search" placeholder="Buscar por nombre o teléfono"></label>
          <ul class="plist" id="plist"></ul>
        </div>
        <div class="panel file" id="file"><p class="muted">Elige un paciente para ver su ficha.</p></div>
      </div>
    </section>
  </div>

  <dialog class="dialog" id="new-dialog" aria-labelledby="new-title">
    <form id="new-form" novalidate>
      <h2 id="new-title">Nueva cita</h2>
      <div class="field"><label for="n-service">Tratamiento</label><select id="n-service" name="serviceId" required></select></div>
      <div class="field"><label for="n-pro">Fisio</label><select id="n-pro" name="professionalId"></select></div>
      <div class="row-2">
        <div class="field"><label for="n-date">Día</label><input type="date" id="n-date" name="date" required></div>
        <div class="field"><label for="n-time">Hora</label><input type="time" id="n-time" name="time" step="900" required></div>
      </div>
      <div class="row-2">
        <div class="field"><label for="n-name">Nombre</label><input id="n-name" name="name" required></div>
        <div class="field"><label for="n-phone">Teléfono</label><input id="n-phone" name="phone" type="tel" required></div>
      </div>
      <div class="field"><label for="n-reason">Motivo</label><input id="n-reason" name="reason" maxlength="500"></div>
      <p class="error" id="new-error" role="alert" hidden></p>
      <div class="dialog__actions">
        <button class="link-btn" type="button" id="new-cancel">Cerrar</button>
        <button class="btn btn--primary" type="submit">Guardar cita</button>
      </div>
    </form>
  </dialog>
</body>
</html>
